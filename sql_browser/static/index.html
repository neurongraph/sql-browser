<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Browser</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/style.css?v=7" />
</head>
<body>
  <header>
    <h1>SQL Browser</h1>

    <div class="toolbar">
      <label class="field">
        <span>File</span>
        <select id="file-select"></select>
      </label>
      <button type="button" id="upload-btn" class="secondary">Upload…</button>
      <input
        type="file"
        id="file-input"
        accept=".db,.sqlite,.sqlite3,.xlsx,.xlsm"
        hidden
      />

      <label class="field">
        <span>Model</span>
        <select id="model-select"></select>
      </label>

      <button type="button" id="load-btn">Load</button>
      <span id="toolbar-status" class="toolbar-status"></span>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <h2>Schema</h2>
      <div id="schema-tree" class="schema-tree">Loading…</div>

      <!--
        Persistent metadata editor. Collapsed by default; the same prose-editor
        component the Excel review modal uses, bound to the RAW document. Preview
        shows what reconciliation would keep/drop; Save regenerates and writes.
      -->
      <section id="metadata-editor" class="hidden">
        <h2 id="metadata-toggle" class="collapsible">Metadata <span class="caret">▸</span></h2>
        <div id="metadata-body" class="hidden">
          <p id="metadata-hint" class="editor-hint"></p>
          <div id="metadata-prose" class="prose-editor"></div>
          <div id="metadata-recon" class="recon-summary"></div>
          <div class="editor-actions">
            <button type="button" id="metadata-preview" class="secondary">Preview</button>
            <button type="button" id="metadata-save">Save</button>
          </div>
        </div>
      </section>
    </aside>

    <main>
      <div id="history" class="history"></div>

      <section class="ask">
        <div id="suggestions" class="suggestions"></div>
        <form id="ask-form">
          <input
            id="nl-input"
            type="text"
            placeholder="Ask a question about your data…"
            autocomplete="off"
          />
          <button type="submit" id="ask-btn">Ask</button>
        </form>
      </section>
    </main>

    <template id="turn-template">
      <article class="turn">
        <div class="turn-q"><span class="q-icon">🔍</span> <span class="q-text"></span></div>

        <section class="sql-section hidden">
          <div class="sql-header">
            <span class="explanation"></span>
            <span class="confidence"></span>
          </div>
          <textarea class="sql-box" spellcheck="false" rows="4"></textarea>
          <div class="sql-actions">
            <button type="button" class="run-btn">Run SQL</button>
          </div>
        </section>

        <section class="picker-section hidden">
          <h3>Some values weren't found in the data</h3>
          <div class="picker-list"></div>
          <button type="button" class="apply-btn">Apply &amp; Run</button>
        </section>

        <section class="status hidden"></section>

        <section class="results-section hidden">
          <div class="results-header">
            <div class="results-meta"></div>
            <div class="export-actions">
              <button type="button" class="copy-btn secondary">Copy</button>
              <button type="button" class="csv-btn secondary">Download CSV</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="results-table"></table>
          </div>
        </section>
      </article>
    </template>
  </div>

  <!--
    Metadata review modal. Shown after loading an Excel workbook that carried a
    documentation sheet: the extracted text is seeded into the prose editor so
    the user can review, edit, and Save it as a sidecar (or discard the offer).
    The prose editor here is the same component B1 mounts in the sidebar.
  -->
  <div id="metadata-review" class="modal-overlay hidden">
    <div class="modal metadata-review">
      <h2>Add metadata from this workbook</h2>
      <p class="modal-intro">
        This workbook has a documentation sheet
        (<span id="mr-sheets"></span>). Its notes are below. Prose is canonical —
        edit it freely; the structured YAML is generated from it and reconciled
        against the real data when you Save.
      </p>

      <div id="mr-editor" class="prose-editor"></div>

      <div id="mr-recon" class="recon-summary"></div>

      <div class="modal-actions">
        <button type="button" id="mr-discard" class="secondary">Discard</button>
        <button type="button" id="mr-preview" class="secondary">Preview</button>
        <button type="button" id="mr-save">Save metadata</button>
      </div>
    </div>
  </div>

  <template id="prose-field-template">
    <label class="prose-field">
      <span class="prose-label"></span>
      <textarea class="prose-input" spellcheck="false" rows="4"></textarea>
    </label>
  </template>

  <script src="/static/app.js?v=6"></script>
</body>
</html>
