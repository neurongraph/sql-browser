[project]
name = "sql-browser"
version = "0.1.0"
description = "A natural language SQLite database explorer using local LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    "json-repair>=0.30.0",
    "openpyxl>=3.1.0",
    "sqlglot>=25.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "duckdb>=1.5.6",
]

[project.scripts]
sql-browser = "sql_browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
